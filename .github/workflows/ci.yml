name: CI Pipeline - Test, Lint & Evaluation Benchmark

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-evaluate:
    name: Pytest & AI Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentic_ai_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: agentic_ai_analytics
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agentic_ai_analytics
      DATABASE_URL_READONLY: postgresql+psycopg://analyst_readonly:analyst_password123@localhost:5432/agentic_ai_analytics
      LLM_PROVIDER: mock
      LLM_API_KEY: mock-key
      API_AUTH_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      QUERY_TIMEOUT_SECONDS: 10
      DEFAULT_ROW_LIMIT: 100
      MAX_ROW_LIMIT: 1000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax & Bytecode Compilation
        run: |
          python -m compileall app scripts tests

      - name: Initialize PostgreSQL Schema, Seed Data & Security Roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d agentic_ai_analytics -f sql/schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d agentic_ai_analytics -f sql/seed.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d agentic_ai_analytics -f sql/02_create_roles.sql

      - name: Run Pytest Test Suite (123 Tests)
        run: |
          pytest -v tests/ --durations=10

      - name: Run AI Evaluation Benchmark (55 Evaluation Cases)
        run: |
          python -m app.evaluation.runner

      - name: Upload AI Evaluation Benchmark Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report-python-${{ matrix.python-version }}
          path: artifacts/evaluation_report.json
          retention-days: 30
